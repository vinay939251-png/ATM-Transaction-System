# ATM Transaction System - Database Configuration
# Copy this file to config.properties and fill in your MySQL credentials.
# NEVER commit config.properties to version control.

db.url=jdbc:mysql://localhost:3306/atm_transaction_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=your_mysql_username
db.password=your_mysql_password

# Connection pool settings
db.pool.maxSize=10
db.pool.minIdle=2

# ATM configuration
atm.max.login.attempts=3
atm.card.block.duration.minutes=30
atm.max.withdrawal.per.transaction=25000.00
atm.max.daily.withdrawal=100000.00
atm.withdrawal.denominations=100,200,500,2000

# Session timeout in minutes
atm.session.timeout.minutes=5
